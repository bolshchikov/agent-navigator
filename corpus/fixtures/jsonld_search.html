<!doctype html>
<html>
<head>
  <title>Docs</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "url": "https://docs.example.com/",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://docs.example.com/search?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
</head>
<body>
  <main>
    <h1>Documentation</h1>
    <p>Search the docs using the site-declared SearchAction. This page is otherwise ordinary static HTML with enough prose that a fetch client can extract it without running any scripts.</p>
  </main>
</body>
</html>
